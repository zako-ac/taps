[workspace]
members = ["google-tap", "papago-tap", "youtube-tap", "sam-tap", "wedding-tap", "supertonic-tap"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22"
bytes = "1.11.1"
dotenvy = "0.15"
hmac = "0.12"
md5 = "0.7"
reqwest = { version = "0.12", features = ["stream"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
tokio = { version = "1.51.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tts-urls = "1.0.0"
url = "2"
urlencoding = "2.1"
uuid = { version = "1.23.0", features = ["v4"] }
yt-dlp = { version = "2.7.2", features = ["live-streaming"] }
zakofish4-tap = { git = "https://github.com/zako-ac/zakofish4", features = ["auto-encode", "healthcheck"] }
#zakofish4-tap = { path = "/home/allen/projects/zakofish4/zakofish4-tap", features = ["auto-encode", "healthcheck"] }
sam-tts = { git = "https://github.com/mincomk/sam-tts" }

