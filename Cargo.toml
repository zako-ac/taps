[workspace]
members = ["google-tap", "papago-tap", "youtube-tap", "sam-tap", "wedding-tap", "supertonic-tap"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22"
bytes = "1.11.1"
dotenvy = "0.15"
hmac = "0.12"
md5 = "0.7"
ogg = { version = "0.9", features = ["async"] }
reqwest = { version = "0.12", features = ["stream"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
tokio = { version = "1.51.0", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1.44"
# `env-filter` is what lets a tap pick its level from RUST_LOG; declared here
# rather than left to feature unification, because unification is how the log
# level silently moved to ERROR once before (see supertonic-tap/src/main.rs).
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tts-urls = "1.0.0"
url = "2"
urlencoding = "2.1"
uuid = { version = "1.23.0", features = ["v4"] }
ydrs = { git = "https://github.com/mincomk/ydrs", default-features = false, features = ["async"] }
ysrs = { git = "https://github.com/mincomk/ysrs" }
yt-dlp = { version = "2.7.2", features = ["live-streaming"] }
# The tap SDK every tap in this workspace now runs on. `healthcheck` is what
# serves /health and /metrics on the port the PodMonitor scrapes; `auto-encode`
# is what turns a synthesized or downloaded file into Opus frames.
#
# No revision pin: this tracks the SDK's main, which is where the SIGTERM drain
# and the request-path counters landed (zakofish4#3). Pin it by `rev` here if a
# tap ever has to be rebuilt reproducibly from an older SDK.
zakofish4-tap = { git = "https://github.com/zako-ac/zakofish4", features = ["auto-encode", "healthcheck"] }
sam-tts = { git = "https://github.com/mincomk/sam-tts" }
