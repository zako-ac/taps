[workspace]
members = ["google-tap", "papago-tap", "youtube-tap", "sam-tap", "wedding-tap", "supertonic-tap"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22"
bytes = "1.11.1"
dotenvy = "0.15"
hmac = "0.12"
md5 = "0.7"
reqwest = { version = "0.12", features = ["stream"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
tokio = { version = "1.51.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tts-urls = "1.0.0"
url = "2"
urlencoding = "2.1"
uuid = { version = "1.23.0", features = ["v4"] }
yt-dlp = { version = "2.7.2", features = ["live-streaming"] }
# Pinned to the commit that has the SIGTERM drain (zako-ac/zako3#116) and the
# request deadline (zako-ac/zako3#128). A tap that dies on SIGTERM sends no close
# frame, and taphub then keeps routing to it until the QUIC idle timeout; a tap
# whose handler stops making progress now ends its own process (exit 70) after
# TAP_REQUEST_DEADLINE_SECS (60s) instead of holding a connection it will never
# answer. The livenessProbe in c1-flux covers the case where it cannot run the
# watchdog at all.
zako3-tap-sdk = { git = "https://github.com/zako-ac/zako3", rev = "c317bc696a73f48ef8ef66a8be06cfd844d245de", features = ["auto-encode", "healthcheck"] }
#zako3-tap-sdk = { path = "/home/allen/projects/zako3/libs/tap-sdk", features = ["auto-encode", "healthcheck"] }
sam-tts = { git = "https://github.com/mincomk/sam-tts" }
