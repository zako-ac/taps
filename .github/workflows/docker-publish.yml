name: Build & Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liblzma-dev

      - name: Build workspace
        run: cargo build --workspace --release

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/google-tap
            target/release/papago-tap
            target/release/youtube-tap
            target/release/wedding-tap
            target/release/supertonic-tap

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tap: google-tap
            dockerfile: Dockerfile.ci
          - tap: papago-tap
            dockerfile: Dockerfile.ci
          - tap: youtube-tap
            dockerfile: Dockerfile.ci
          - tap: wedding-tap
            dockerfile: Dockerfile.ci
          # supertonic comes from a different Dockerfile: its runtime image needs
          # the ONNX Runtime tarball from github.com/microsoft/onnxruntime, and
          # that repository answers 404 as of 2026-11-18 (the whole repo, not
          # just the v1.22.0 asset), so `Dockerfile.ci` cannot build it at all.
          # See Dockerfile.ci-supertonic.
          - tap: supertonic-tap
            dockerfile: Dockerfile.ci-supertonic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: target/release/

      - name: Mark binary executable
        run: chmod +x target/release/${{ matrix.tap }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tap }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: BIN=${{ matrix.tap }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
